name: Corpus release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_corpus.py
      - run: python scripts/integrate_speaker_transcripts.py --validate-only
      - run: python scripts/check_publication.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test platform/train.test.mjs platform/chat-pages/rhysbot-chat.test.mjs platform/chat-pages/rhysbot-voice-stream.test.mjs site/chat/app.test.mjs site/chat/voice-stream.test.mjs
